<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF - Registros Vigilia 2026</title>
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;background:#eef1f5;font-family:Arial,Helvetica,sans-serif}
.pdf-tools{position:fixed;right:18px;top:18px;z-index:10;display:flex;gap:8px}
.pdf-tools button{border:0;border-radius:8px;padding:10px 14px;background:#173d8e;color:#fff;font-weight:700;cursor:pointer}
.pdf-tools button.secondary{background:#e8edf6;color:#24364e}
.pdf-sheet{width:210mm;min-height:297mm;margin:20px auto;background:#fff;padding:12mm 12mm 10mm;box-shadow:0 4px 24px rgba(0,0,0,.12);box-sizing:border-box}
.pdf-sheet + .pdf-sheet{page-break-before:always}
.pdf-sheet input,.pdf-sheet textarea{pointer-events:none}
.pdf-sheet .print-id{font-size:9px;color:#65758a;text-align:right;margin-bottom:3px}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .pdf-sheet{margin:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="pdf-tools no-print">
  <button onclick="window.print()">📄 Guardar PDF / Imprimir</button>
  <button class="secondary" onclick="location.href='registros.html'">← Volver</button>
</div>
<div id="pdfContainer"></div>

<script>
const KEY='vigilia2026_registros';
const IDS_KEY='vigilia2026_pdf_ids';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

function getRecords(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function box(name,value,checkedValue=''){
  return `<input type="text" value="${esc(value)}" aria-label="${name}">`;
}
function check(value,selected){return `<input type="checkbox" ${value===selected?'checked':''}>`}
function sheet(r){
 return `<section class="pdf-sheet">
   <div class="print-id">Registro: ${esc(r.idRegistro)} · ${esc(r.fechaRegistro)}</div>
   <header class="sheet-header">
    <div class="top-pill">VIGILIA NACIONAL PROCESOS 2026</div>
    <h1>FICHA OFICIAL DE INSCRIPCIÓN FÍSICA</h1>
    <h2>Ministerio Nacional de Jóvenes IDP — Nicaragua</h2>
   </header>
   <section class="form-section">
    <div class="section-title"><span>📝</span> SECCIÓN 1: DATOS PERSONALES DEL ASISTENTE</div>
    <div class="field-row full"><label>NOMBRES COMPLETOS:</label>${box('nombres',r.nombres)}</div>
    <div class="field-row full"><label>APELLIDOS COMPLETOS:</label>${box('apellidos',r.apellidos)}</div>
    <div class="grid-2 age-phone">
      <div class="field-row inline-field"><label>EDAD:</label><span class="bracket">[</span>${box('edad',r.edad)}<span class="bracket">]</span><span>años</span></div>
      <div class="field-row inline-field grow-line"><label>TELÉFONO / WHATSAPP:</label>${box('telefono',r.telefono)}</div>
    </div>
    <div class="field-row full email-row"><label>CORREO<br>ELECTRÓNICO:</label>${box('correo',r.correo)}</div>
    <div class="sub-label">TALLA DE CAMISA SOLICITADA <span>(MARCAR ÚNICAMENTE UNA CASILLA) :</span></div>
    <div class="check-grid shirt-grid">
      <label>${check('14 Juvenil',r.talla)} Talla 14 (Juvenil)</label><label>${check('S Adulto',r.talla)} Talla S (Adulto)</label><label>${check('XL Adulto',r.talla)} Talla XL (Adulto)</label>
      <label>${check('16 Juvenil',r.talla)} Talla 16 (Juvenil)</label><label>${check('M Adulto',r.talla)} Talla M (Adulto)</label><label>${check('2XL Adulto',r.talla)} Talla 2XL (Adulto)</label>
      <label>${check('18 Juvenil',r.talla)} Talla 18 (Juvenil)</label><label>${check('L Adulto',r.talla)} Talla L (Adulto)</label><label>${check('3XL Adulto',r.talla)} Talla 3XL (Adulto)</label>
    </div>
   </section>
   <section class="form-section">
    <div class="section-title"><span>⛪</span> SECCIÓN 2: INFORMACIÓN DE LA IGLESIA</div>
    <div class="grid-2 region-district">
      <div class="field-row inline-field"><label>REGIÓN:</label><span>[ Región No.</span>${box('region',r.region)}<span>]</span></div>
      <div class="field-row inline-field"><label>DISTRITO:</label><span>[ Distrito No.</span>${box('distrito',r.distrito)}<span>]</span></div>
    </div>
    <div class="field-row full church-name"><label>NOMBRE DE LA IGLESIA<br>LOCAL:</label>${box('iglesia',r.iglesia)}</div>
    <div class="field-row full"><label>NOMBRE DEL PASTOR LOCAL:</label>${box('pastor',r.pastor)}</div>
    <div class="sub-label role-title">CARGO / FUNCIÓN EN LA IGLESIA:</div>
    <div class="check-grid role-grid">
      <label>${check('Líder',r.cargo)} Líder</label><label>${check('Miembro',r.cargo)} Miembro</label><label>${check('Amigo',r.cargo)} Amigo</label>
    </div>
   </section>
   <section class="form-section medical-section">
    <div class="section-title"><span>🩺</span> SECCIÓN 3: FICHA MÉDICA Y ALERGIAS (OBLIGATORIO)</div>
    <div class="question">¿PADECE ALGUNA ALERGIA, ENFERMEDAD CRÓNICA O CONDICIÓN MÉDICA ESPECIAL?</div>
    <div class="medical-options">
      <label>${check('NO',r.condicionMedica)} NO</label>
      <label>${check('SÍ',r.condicionMedica)} SÍ (Especificar detalles a continuación):</label>
    </div>
    <textarea rows="2">${esc(r.detalleMedico)}</textarea>
    <div class="example">*(Ejemplo: Alérgico a la penicilina, asma severa, alergia al maní, etc.)*</div>
   </section>
   <section class="form-section payment-section">
    <div class="section-title"><span>💵</span> SECCIÓN 4: CONTROL DE PAGO EN EFECTIVO (USO EXCLUSIVO DEL LÍDER REGIONAL)</div>
    <div class="payment-grid">
      <div><div class="payment-label">MONTO RECIBIDO:</div><div class="money-line"><b>C$</b>${box('monto',r.monto)}<b>NIO</b></div></div>
      <div><div class="payment-label">FIRMA DE RECIBIDO DEL LÍDER REGIONAL:</div><input class="signature-line" type="text" value="${esc(r.firmaLider)}"></div>
      <div><div class="payment-label">FECHA DE RECEPCIÓN:</div><div class="date-line"><span>[</span>${box('dia',r.dia)}<span>/</span>${box('mes',r.mes)}<span>/ 2026 ]</span></div></div>
    </div>
   </section>
   <footer class="sheet-footer">Nota: Esta ficha debe ser entregada al Líder Regional junto con la cuota de inscripción en efectivo para su registro oficial en el sistema.</footer>
 </section>`;
}

const ids=JSON.parse(localStorage.getItem(IDS_KEY)||'[]');
const all=getRecords();
const chosen=ids.length?all.filter(r=>ids.includes(r.idRegistro)):all;
document.getElementById('pdfContainer').innerHTML=chosen.map(sheet).join('');
localStorage.removeItem(IDS_KEY);
</script>
</body>
</html>
