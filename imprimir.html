<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
Ficha Oficial - Vigilia Nacional Procesos 2026
</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #e5e7eb;
  font-family: Arial, Helvetica, sans-serif;
  color: #111827;
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #111827;
  padding: 12px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.toolbar button {
  border: 0;
  border-radius: 8px;
  padding: 10px 18px;
  cursor: pointer;
  font-weight: bold;
  color: white;
  background: #2563eb;
}

.toolbar button.secondary {
  background: #4b5563;
}

.sheet-container {
  padding: 20px;
}

.sheet {
  width: 210mm;
  min-height: 297mm;
  margin: auto;
  background: white;
  padding: 10mm;
  box-shadow: 0 5px 25px rgba(0,0,0,.15);
}

.sheet-header {
  text-align: center;
  border-bottom: 2px solid #111827;
  padding-bottom: 8px;
}

.top-pill {
  display: inline-block;
  padding: 5px 14px;
  border-radius: 20px;
  background: #111827;
  color: white;
  font-size: 12px;
  font-weight: bold;
}

h1 {
  font-size: 20px;
  margin: 8px 0 3px;
}

h2 {
  font-size: 12px;
  margin: 0;
  font-weight: normal;
}

.form-section {
  border: 1px solid #111827;
  margin-top: 10px;
}

.section-title {
  background: #111827;
  color: white;
  padding: 7px 9px;
  font-size: 11px;
  font-weight: bold;
}

.section-title span {
  margin-right: 5px;
}

.field-row {
  display: flex;
  align-items: center;
  min-height: 31px;
  border-bottom: 1px solid #d1d5db;
  padding: 4px 7px;
}

.field-row:last-child {
  border-bottom: 0;
}

.field-row label {
  font-size: 10px;
  font-weight: bold;
  min-width: 170px;
}

.field-value {
  flex: 1;
  min-height: 20px;
  border-bottom: 1px solid #111827;
  padding: 2px 5px;
  font-size: 11px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.grid-2 > div {
  border-right: 1px solid #d1d5db;
}

.grid-2 > div:last-child {
  border-right: 0;
}

.inline {
  display: flex;
  align-items: center;
  gap: 5px;
}

.inline .field-label {
  font-size: 10px;
  font-weight: bold;
}

.sub-label {
  font-size: 10px;
  font-weight: bold;
  padding: 7px;
}

.check-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  padding: 7px;
  font-size: 10px;
}

.check-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.check {
  width: 13px;
  height: 13px;
  border: 1px solid #111827;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
}

.medical-question {
  padding: 8px;
  font-size: 10px;
  font-weight: bold;
}

.medical-options {
  display: flex;
  gap: 30px;
  padding: 0 8px 7px;
  font-size: 10px;
}

.detail-box {
  margin: 5px 8px 8px;
  min-height: 40px;
  border: 1px solid #111827;
  padding: 6px;
  font-size: 10px;
}

.example {
  font-size: 8px;
  padding: 0 8px 8px;
  font-style: italic;
}

.payment-grid {
  display: grid;
  grid-template-columns: 1fr 1.5fr 1fr;
}

.payment-cell {
  min-height: 70px;
  border-right: 1px solid #d1d5db;
  padding: 7px;
}

.payment-cell:last-child {
  border-right: 0;
}

.payment-label {
  font-size: 9px;
  font-weight: bold;
  margin-bottom: 12px;
}

.payment-value {
  border-bottom: 1px solid #111827;
  min-height: 20px;
  font-size: 11px;
}

.signature {
  margin-top: 25px;
}

.footer {
  margin-top: 10px;
  border: 1px solid #111827;
  padding: 7px;
  font-size: 8px;
  text-align: center;
}

.record-id {
  text-align: right;
  margin-top: 5px;
  font-size: 7px;
  color: #6b7280;
}

@media print {

  @page {
    size: A4 portrait;
    margin: 0;
  }

  html,
  body {
    background: white;
  }

  .toolbar {
    display: none !important;
  }

  .sheet-container {
    padding: 0;
  }

  .sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 0;
    box-shadow: none;
  }

}

</style>

</head>

<body>

<div class="toolbar">

  <button onclick="window.print()">
    🖨️ Imprimir / Guardar PDF
  </button>

  <button
    class="secondary"
    onclick="window.close()"
  >
    Cerrar
  </button>

</div>

<div
  id="content"
  class="sheet-container"
>
  Cargando ficha...
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

const supabase =
  window.supabaseClient;

function escapeHTML(value) {

  if (value === null ||
      value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function check(value) {

  return value
    ? "✓"
    : "";

}

function ficha(r) {

  const talla =
    r.talla || "";

  const cargo =
    r.cargo || "";

  const condicion =
    r.condicionMedica || "";

  return `

  <div class="sheet">

    <header class="sheet-header">

      <div class="top-pill">
        VIGILIA NACIONAL PROCESOS 2026
      </div>

      <h1>
        FICHA OFICIAL DE INSCRIPCIÓN FÍSICA
      </h1>

      <h2>
        Ministerio Nacional de Jóvenes IDP — Nicaragua
      </h2>

    </header>


    <!-- DATOS PERSONALES -->

    <section class="form-section">

      <div class="section-title">
        📝 SECCIÓN 1: DATOS PERSONALES DEL ASISTENTE
      </div>

      <div class="field-row">
        <label>NOMBRES COMPLETOS:</label>
        <div class="field-value">
          ${escapeHTML(r.nombres)}
        </div>
      </div>

      <div class="field-row">
        <label>APELLIDOS COMPLETOS:</label>
        <div class="field-value">
          ${escapeHTML(r.apellidos)}
        </div>
      </div>

      <div class="grid-2">

        <div class="field-row">
          <span class="field-label">
            EDAD:
          </span>

          <div class="field-value">
            ${escapeHTML(r.edad)} años
          </div>
        </div>

        <div class="field-row">
          <span class="field-label">
            TELÉFONO / WHATSAPP:
          </span>

          <div class="field-value">
            ${escapeHTML(r.telefono)}
          </div>
        </div>

      </div>

      <div class="field-row">

        <label>
          CORREO ELECTRÓNICO:
        </label>

        <div class="field-value">
          ${escapeHTML(r.correo)}
        </div>

      </div>


      <div class="sub-label">
        TALLA DE CAMISA SOLICITADA:
      </div>

      <div class="check-grid">

        <div class="check-item">
          <span class="check">
            ${check(talla === "14 Juvenil")}
          </span>
          Talla 14 (Juvenil)
        </div>

        <div class="check-item">
          <span class="check">
            ${check(talla === "S Adulto")}
          </span>
          Talla S (Adulto)
        </div>

        <div class="check-item">
          <span class="check">
            ${check(talla === "XL Adulto")}
          </span>
          Talla XL (Adulto)
        </div>

        <div class="check-item">
          <span class="check">
            ${check(talla === "16 Juvenil")}
          </span>
          Talla 16 (Juvenil)
        </div>

        <div class="check-item">
          <span class="check">
            ${check(talla === "M Adulto")}
          </span>
          Talla M (Adulto)
        </div>

        <div class="check-item">
          <span class="check">
            ${check(talla === "2XL Adulto")}
          </span>
          Talla 2XL (Adulto)
        </div>

        <div class="check-item">
          <span class="check">
            ${check(talla === "18 Juvenil")}
          </span>
          Talla 18 (Juvenil)
        </div>

        <div class="check-item">
          <span class="check">
            ${check(talla === "L Adulto")}
          </span>
          Talla L (Adulto)
        </div>

        <div class="check-item">
          <span class="check">
            ${check(talla === "3XL Adulto")}
          </span>
          Talla 3XL (Adulto)
        </div>

      </div>

    </section>


    <!-- IGLESIA -->

    <section class="form-section">

      <div class="section-title">
        ⛪ SECCIÓN 2: INFORMACIÓN DE LA IGLESIA
      </div>

      <div class="grid-2">

        <div class="field-row">

          <span class="field-label">
            REGIÓN:
          </span>

          <div class="field-value">
            Región No. ${escapeHTML(r.region)}
          </div>

        </div>

        <div class="field-row">

          <span class="field-label">
            DISTRITO:
          </span>

          <div class="field-value">
            Distrito No. ${escapeHTML(r.distrito)}
          </div>

        </div>

      </div>


      <div class="field-row">

        <label>
          NOMBRE DE LA IGLESIA LOCAL:
        </label>

        <div class="field-value">
          ${escapeHTML(r.iglesia)}
        </div>

      </div>


      <div class="field-row">

        <label>
          NOMBRE DEL PASTOR LOCAL:
        </label>

        <div class="field-value">
          ${escapeHTML(r.pastor)}
        </div>

      </div>


      <div class="sub-label">
        CARGO / FUNCIÓN EN LA IGLESIA:
      </div>

      <div class="check-grid">

        <div class="check-item">

          <span class="check">
            ${check(cargo === "Líder")}
          </span>

          Líder

        </div>

        <div class="check-item">

          <span class="check">
            ${check(cargo === "Miembro")}
          </span>

          Miembro

        </div>

        <div class="check-item">

          <span class="check">
            ${check(cargo === "Amigo")}
          </span>

          Amigo

        </div>

      </div>

    </section>


    <!-- MEDICA -->

    <section class="form-section">

      <div class="section-title">
        🩺 SECCIÓN 3: FICHA MÉDICA Y ALERGIAS (OBLIGATORIO)
      </div>

      <div class="medical-question">

        ¿PADECE ALGUNA ALERGIA, ENFERMEDAD CRÓNICA
        O CONDICIÓN MÉDICA ESPECIAL?

      </div>

      <div class="medical-options">

        <div>

          <span class="check">
            ${check(condicion === "NO")}
          </span>

          NO

        </div>

        <div>

          <span class="check">
            ${check(condicion === "SÍ")}
          </span>

          SÍ

        </div>

      </div>

      <div class="detail-box">

        ${escapeHTML(r.detalleMedico)}

      </div>

      <div class="example">

        *(Ejemplo: Alérgico a la penicilina,
        asma severa, alergia al maní, etc.)*

      </div>

    </section>


    <!-- PAGO -->

    <section class="form-section">

      <div class="section-title">

        💵 SECCIÓN 4: CONTROL DE PAGO EN EFECTIVO
        (USO EXCLUSIVO DEL LÍDER REGIONAL)

      </div>

      <div class="payment-grid">

        <div class="payment-cell">

          <div class="payment-label">
            MONTO RECIBIDO:
          </div>

          <div class="payment-value">
            C$ ${escapeHTML(r.monto)} NIO
          </div>

        </div>


        <div class="payment-cell">

          <div class="payment-label">
            FIRMA DE RECIBIDO DEL LÍDER REGIONAL:
          </div>

          <div class="payment-value signature">
            ${escapeHTML(r.firmaLider)}
          </div>

        </div>


        <div class="payment-cell">

          <div class="payment-label">
            FECHA DE RECEPCIÓN:
          </div>

          <div class="payment-value">

            ${escapeHTML(r.dia)}
            /
            ${escapeHTML(r.mes)}
            /
            2026

          </div>

        </div>

      </div>

    </section>


    <div class="footer">

      Nota: Esta ficha debe ser entregada al Líder Regional
      junto con la cuota de inscripción en efectivo
      para su registro oficial en el sistema.

    </div>

    <div class="record-id">

      ID: ${escapeHTML(r.idRegistro)}
      &nbsp; | &nbsp;
      Registro: ${escapeHTML(r.fechaRegistro)}

    </div>

  </div>

  `;

}


async function cargar() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const preview =
    params.get("preview");

  const ids =
    params.get("ids");

  const content =
    document.getElementById("content");


  // ===================================================
  // VISTA PREVIA
  // ===================================================

  if (preview === "1") {

    const saved =
      localStorage.getItem(
        "vigiliaPreview"
      );

    if (!saved) {

      content.innerHTML =
        "<p>No hay datos para mostrar.</p>";

      return;

    }

    const record =
      JSON.parse(saved);

    content.innerHTML =
      ficha(record);

    return;
  }


  // ===================================================
  // REGISTRO/S
  // ===================================================

  if (!ids) {

    content.innerHTML =
      "<p>No se especificó ningún registro.</p>";

    return;

  }

  const requestedIds =
    ids
      .split(",")
      .map(id => id.trim())
      .filter(Boolean);


  const { data, error } =
    await supabase
      .from("registros_vigilia")
      .select("*")
      .in(
        "idRegistro",
        requestedIds
      );


  if (error) {

    console.error(error);

    content.innerHTML =
      `<p>Error cargando registros:<br>
      ${escapeHTML(error.message)}</p>`;

    return;

  }


  const map =
    new Map(
      data.map(
        record => [
          record.idRegistro,
          record
        ]
      )
    );


  content.innerHTML =
    requestedIds
      .map(id => map.get(id))
      .filter(Boolean)
      .map(ficha)
      .join("");

}


cargar();

</script>

</body>
</html>
