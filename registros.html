<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Registros - Vigilia Nacional Procesos 2026</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #eef1f5;
      color: #2f3d52;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 1500px;
      margin: auto;
    }

    .header {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      color: #173d8e;
    }

    .subtitle {
      margin-top: 5px;
      color: #66778d;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #173d8e;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button.secondary {
      background: #e8edf6;
      color: #24364e;
    }

    button.danger {
      background: #8f2d2d;
    }

    .search {
      width: 100%;
      margin-top: 15px;
      padding: 11px;
      border: 1px solid #cbd6e5;
      border-radius: 8px;
      font-size: 14px;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 7px;
      background: #f1f5f9;
      color: #53647a;
      font-weight: 700;
      font-size: 13px;
    }

    .status.ok {
      color: #176b35;
      background: #edf9f0;
    }

    .status.error {
      color: #9a2727;
      background: #fff0f0;
    }

    .table-box {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      overflow: auto;
    }

    table {
      width: 100%;
      min-width: 1200px;
      border-collapse: collapse;
    }

    th {
      background: #173d8e;
      color: white;
      padding: 11px 9px;
      text-align: left;
      font-size: 12px;
      white-space: nowrap;
    }

    td {
      padding: 10px 9px;
      border-bottom: 1px solid #e4e9f0;
      font-size: 12px;
    }

    tr:hover td {
      background: #f7faff;
    }

    .id {
      font-family: monospace;
      font-size: 11px;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      gap: 5px;
    }

    .actions button {
      padding: 6px 9px;
      font-size: 11px;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #66778d;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- ENCABEZADO -->

  <div class="header">

    <h1>
      📋 Registros de Inscripción
    </h1>

    <div class="subtitle">
      Vigilia Nacional Procesos 2026
    </div>


    <div class="toolbar">

      <button
        onclick="goBack()"
      >
        ← Nueva ficha
      </button>


      <button
        class="secondary"
        onclick="loadRecords()"
      >
        🔄 Actualizar
      </button>


      <button
        class="secondary"
        onclick="printSelected()"
      >
        🖨️ Imprimir seleccionados
      </button>


      <button
        class="secondary"
        onclick="printAll()"
      >
        🖨️ Imprimir todos
      </button>

    </div>


    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Buscar por nombre, apellido, teléfono, iglesia, ID..."
    >


    <div
      id="status"
      class="status"
    >
      Cargando registros...
    </div>

  </div>


  <!-- TABLA -->

  <div class="table-box">

    <table>

      <thead>

        <tr>

          <th>
            <input
              type="checkbox"
              id="selectAll"
            >
          </th>

          <th>ID</th>

          <th>Fecha</th>

          <th>Nombres</th>

          <th>Apellidos</th>

          <th>Edad</th>

          <th>Teléfono</th>

          <th>Talla</th>

          <th>Región</th>

          <th>Distrito</th>

          <th>Iglesia</th>

          <th>Pago</th>

          <th>Acciones</th>

        </tr>

      </thead>


      <tbody
        id="recordsBody"
      ></tbody>

    </table>

  </div>


</div>


<!-- ================================================= -->
<!-- SUPABASE -->
<!-- ================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

  // =====================================================
  // SUPABASE
  // =====================================================

  const supabase =
    window.supabaseClient;


  let allRecords = [];


  // =====================================================
  // ESTADO
  // =====================================================

  function setStatus(
    message,
    type = ""
  ) {

    const status =
      document.getElementById(
        "status"
      );

    status.textContent =
      message;

    status.className =
      "status " + type;

  }


  // =====================================================
  // CARGAR REGISTROS
  // =====================================================

  async function loadRecords() {

    try {

      setStatus(
        "🔄 Cargando registros desde Supabase..."
      );


      if (!supabase) {

        throw new Error(
          "Supabase no está configurado."
        );

      }


      console.log(
        "📡 Consultando registros_vigilia..."
      );


      const {
        data,
        error
      } = await supabase

        .from(
          "registros_vigilia"
        )

        .select("*");


      if (error) {

        console.error(
          "❌ Error Supabase:",
          error
        );

        throw error;

      }


      allRecords =
        data || [];


      console.log(
        "✅ Registros recibidos:",
        allRecords
      );


      renderRecords(
        allRecords
      );


      setStatus(

        "✅ " +
        allRecords.length +
        " registro(s) cargado(s) desde Supabase.",

        "ok"

      );


    } catch (error) {

      console.error(
        "❌ ERROR:",
        error
      );


      setStatus(

        "❌ No se pudieron cargar los registros: " +

        (
          error.message ||
          "Error desconocido"
        ),

        "error"

      );

    }

  }


  // =====================================================
  // ESCAPAR HTML
  // =====================================================

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  // =====================================================
  // MOSTRAR TABLA
  // =====================================================

  function renderRecords(
    records
  ) {

    const body =
      document.getElementById(
        "recordsBody"
      );


    body.innerHTML = "";


    if (
      !records ||
      records.length === 0
    ) {

      body.innerHTML = `

        <tr>

          <td
            colspan="13"
            class="empty"
          >

            📭 No hay registros para mostrar.

          </td>

        </tr>

      `;

      return;

    }


    records.forEach(
      record => {

        const row =
          document.createElement(
            "tr"
          );


        row.innerHTML = `

          <td>

            <input
              type="checkbox"
              class="record-check"
              value="${escapeHTML(record.idRegistro)}"
            >

          </td>


          <td class="id">

            ${escapeHTML(
              record.idRegistro
            )}

          </td>


          <td>

            ${escapeHTML(
              record.fechaRegistro
            )}

          </td>


          <td>

            ${escapeHTML(
              record.nombres
            )}

          </td>


          <td>

            ${escapeHTML(
              record.apellidos
            )}

          </td>


          <td>

            ${escapeHTML(
              record.edad
            )}

          </td>


          <td>

            ${escapeHTML(
              record.telefono
            )}

          </td>


          <td>

            ${escapeHTML(
              record.talla
            )}

          </td>


          <td>

            ${escapeHTML(
              record.region
            )}

          </td>


          <td>

            ${escapeHTML(
              record.distrito
            )}

          </td>


          <td>

            ${escapeHTML(
              record.iglesia
            )}

          </td>


          <td>

            ${
              record.monto
                ? "C$ " +
                  escapeHTML(
                    record.monto
                  )
                : ""
            }

          </td>


          <td>

            <div class="actions">

              <button
                onclick="openRecord('${encodeURIComponent(record.idRegistro)}')"
              >
                👁️ Ver
              </button>


              <button
                class="secondary"
                onclick="printOne('${encodeURIComponent(record.idRegistro)}')"
              >
                🖨️
              </button>

            </div>

          </td>

        `;


        body.appendChild(
          row
        );

      }
    );

  }


  // =====================================================
  // VER REGISTRO
  // =====================================================

  function openRecord(
    encodedId
  ) {

    const id =
      decodeURIComponent(
        encodedId
      );


    window.location.href =
      "imprimir.html?ids=" +
      encodeURIComponent(
        id
      );

  }


  // =====================================================
  // IMPRIMIR UNO
  // =====================================================

  function printOne(
    encodedId
  ) {

    const id =
      decodeURIComponent(
        encodedId
      );


    window.open(

      "imprimir.html?ids=" +
      encodeURIComponent(
        id
      ),

      "_blank"

    );

  }


  // =====================================================
  // SELECCIONAR TODOS
  // =====================================================

  document
    .getElementById(
      "selectAll"
    )
    .addEventListener(
      "change",
      function () {

        document
          .querySelectorAll(
            ".record-check"
          )
          .forEach(
            checkbox => {

              checkbox.checked =
                this.checked;

            }
          );

      }
    );


  // =====================================================
  // OBTENER SELECCIONADOS
  // =====================================================

  function getSelectedIds() {

    return Array.from(

      document.querySelectorAll(
        ".record-check:checked"
      )

    ).map(
      checkbox =>
        checkbox.value
    );

  }


  // =====================================================
  // IMPRIMIR SELECCIONADOS
  // =====================================================

  function printSelected() {

    const ids =
      getSelectedIds();


    if (
      ids.length === 0
    ) {

      alert(
        "⚠️ Selecciona al menos un registro."
      );

      return;

    }


    window.open(

      "imprimir.html?ids=" +
      encodeURIComponent(
        ids.join(",")
      ),

      "_blank"

    );

  }


  // =====================================================
  // IMPRIMIR TODOS
  // =====================================================

  function printAll() {

    if (
      allRecords.length === 0
    ) {

      alert(
        "⚠️ No hay registros para imprimir."
      );

      return;

    }


    const ids =
      allRecords.map(
        record =>
          record.idRegistro
      );


    window.open(

      "imprimir.html?ids=" +
      encodeURIComponent(
        ids.join(",")
      ),

      "_blank"

    );

  }


  // =====================================================
  // BÚSQUEDA
  // =====================================================

  document
    .getElementById(
      "search"
    )
    .addEventListener(
      "input",
      function () {

        const text =
          this.value
            .toLowerCase()
            .trim();


        if (!text) {

          renderRecords(
            allRecords
          );

          return;

        }


        const filtered =
          allRecords.filter(
            record => {

              const content = [

                record.idRegistro,

                record.fechaRegistro,

                record.nombres,

                record.apellidos,

                record.edad,

                record.telefono,

                record.correo,

                record.talla,

                record.region,

                record.distrito,

                record.iglesia,

                record.pastor,

                record.cargo,

                record.condicionMedica,

                record.detalleMedico,

                record.monto

              ]

                .join(" ")
                .toLowerCase();


              return content.includes(
                text
              );

            }
          );


        renderRecords(
          filtered
        );

      }
    );


  // =====================================================
  // VOLVER
  // =====================================================

  function goBack() {

    window.location.href =
      "index.html";

  }


  // =====================================================
  // INICIAR
  // =====================================================

  loadRecords();

</script>


</body>

</html>
