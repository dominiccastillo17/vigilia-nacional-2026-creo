<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registros - Vigilia Nacional Procesos 2026</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #eef1f5;
  color: #26364d;
  font-family: Arial, Helvetica, sans-serif;
}

.container {
  max-width: 1400px;
  margin: auto;
}

.header {
  background: #173d8e;
  color: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
}

.header h1 {
  margin: 0 0 5px;
  font-size: 25px;
}

.header p {
  margin: 0;
  opacity: .9;
}

.controls {
  background: white;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

.search {
  width: 100%;
  padding: 11px;
  border: 1px solid #c8d2df;
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 10px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 10px 13px;
  background: #173d8e;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

button.secondary {
  background: #e8edf6;
  color: #24364e;
}

button.danger {
  background: #8f2d2d;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.status {
  margin-top: 10px;
  font-weight: 700;
  font-size: 13px;
}

.table-wrap {
  background: white;
  border-radius: 12px;
  overflow: auto;
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1100px;
}

th,
td {
  padding: 10px;
  border-bottom: 1px solid #e1e6ed;
  text-align: left;
  font-size: 13px;
}

th {
  background: #f4f7fb;
  color: #173d8e;
}

tr:hover {
  background: #fafcff;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.small-btn {
  padding: 6px 8px;
  font-size: 11px;
}

.back {
  margin-bottom: 15px;
}

.empty {
  padding: 30px;
  text-align: center;
  color: #66778d;
}
</style>
</head>

<body>

<div class="container">

  <div class="back">
    <button class="secondary" onclick="location.href='index.html'">
      ← Volver a la ficha
    </button>
  </div>

  <div class="header">
    <h1>📋 Registros de Vigilia Nacional Procesos 2026</h1>
    <p>Base de datos compartida de inscripciones</p>
  </div>

  <div class="controls">

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Buscar por nombre, teléfono, iglesia, distrito, región o ID..."
    >

    <div class="buttons">

      <button id="selectAll">
        ☑️ Seleccionar todos
      </button>

      <button id="clearSelection" class="secondary">
        Limpiar selección
      </button>

      <button id="printSelected">
        🖨️ Imprimir seleccionados
      </button>

      <button id="printAll">
        📄 Imprimir todos
      </button>

      <button id="refresh" class="secondary">
        🔄 Actualizar
      </button>

      <button id="deleteSelected" class="danger">
        🗑️ Eliminar seleccionados
      </button>

      <button id="deleteAll" class="danger">
        ⚠️ Eliminar todos
      </button>

    </div>

    <div id="status" class="status">
      Cargando registros...
    </div>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>
            <input type="checkbox" id="masterCheck">
          </th>
          <th>ID</th>
          <th>Fecha</th>
          <th>Nombre completo</th>
          <th>Edad</th>
          <th>Teléfono</th>
          <th>Talla</th>
          <th>Región</th>
          <th>Distrito</th>
          <th>Iglesia</th>
          <th>Cargo</th>
          <th>Condición médica</th>
          <th>Monto</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody id="recordsBody"></tbody>

    </table>

    <div id="empty" class="empty" style="display:none;">
      No hay registros para mostrar.
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const body = document.getElementById('recordsBody');
const empty = document.getElementById('empty');
const status = document.getElementById('status');
const search = document.getElementById('search');
const masterCheck = document.getElementById('masterCheck');

let records = [];

function ready() {
  return (
    typeof window.supabaseClient !== 'undefined' &&
    window.supabaseClient !== null
  );
}

function setStatus(text, type = '') {
  status.textContent = text;
  status.style.color =
    type === 'error' ? '#9a2727' : '#26364d';
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function selectedIds() {
  return [
    ...document.querySelectorAll(
      '.record-check:checked'
    )
  ].map(input => input.value);
}

function render() {
  const term =
    search.value.trim().toLowerCase();

  const filtered = records.filter(record => {

    const text = [
      record.idRegistro,
      record.fechaRegistro,
      record.nombres,
      record.apellidos,
      record.telefono,
      record.talla,
      record.region,
      record.distrito,
      record.iglesia,
      record.pastor,
      record.cargo,
      record.condicionMedica
    ]
      .join(' ')
      .toLowerCase();

    return text.includes(term);
  });

  body.innerHTML = '';

  if (!filtered.length) {
    empty.style.display = 'block';
    masterCheck.checked = false;
    return;
  }

  empty.style.display = 'none';

  filtered.forEach(record => {

    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>
        <input
          type="checkbox"
          class="record-check"
          value="${escapeHtml(record.idRegistro)}"
        >
      </td>

      <td>${escapeHtml(record.idRegistro)}</td>

      <td>${escapeHtml(record.fechaRegistro)}</td>

      <td>
        <strong>
          ${escapeHtml(record.nombres)}
          ${escapeHtml(record.apellidos)}
        </strong>
      </td>

      <td>${escapeHtml(record.edad)}</td>

      <td>${escapeHtml(record.telefono)}</td>

      <td>${escapeHtml(record.talla)}</td>

      <td>${escapeHtml(record.region)}</td>

      <td>${escapeHtml(record.distrito)}</td>

      <td>${escapeHtml(record.iglesia)}</td>

      <td>${escapeHtml(record.cargo)}</td>

      <td>
        ${escapeHtml(record.condicionMedica)}
        ${record.detalleMedico
          ? '<br>' + escapeHtml(record.detalleMedico)
          : ''}
      </td>

      <td>
        ${record.monto
          ? 'C$ ' + escapeHtml(record.monto)
          : ''}
      </td>

      <td>
        <div class="actions">

          <button
            class="small-btn"
            onclick="openRecord('${encodeURIComponent(record.idRegistro)}')"
          >
            Abrir
          </button>

          <button
            class="small-btn secondary"
            onclick="printOne('${encodeURIComponent(record.idRegistro)}')"
          >
            Imprimir
          </button>

          <button
            class="small-btn danger"
            onclick="deleteOne('${encodeURIComponent(record.idRegistro)}')"
          >
            Eliminar
          </button>

        </div>
      </td>
    `;

    body.appendChild(tr);
  });
}

async function loadRecords() {

  if (!ready()) {
    setStatus(
      'Supabase no está configurado correctamente.',
      'error'
    );
    return;
  }

  setStatus('Cargando registros...');

  try {

    const { data, error } =
      await window.supabaseClient
        .from('registros_vigilia')
        .select('*');

    if (error) {
      console.error(error);

      setStatus(
        'Error al cargar: ' + error.message,
        'error'
      );

      return;
    }

    records = data || [];

    records.sort((a, b) => {
      const idA = String(a.idRegistro || '');
      const idB = String(b.idRegistro || '');

      return idB.localeCompare(idA);
    });

    render();

    setStatus(
      `${records.length} registro(s) encontrado(s).`
    );

  } catch (error) {

    console.error(error);

    setStatus(
      'Ocurrió un error al cargar los registros.',
      'error'
    );
  }
}

function openRecord(id) {
  location.href =
    'index.html?id=' +
    encodeURIComponent(
      decodeURIComponent(id)
    );
}

function printOne(id) {

  const decoded =
    decodeURIComponent(id);

  location.href =
    'imprimir.html?ids=' +
    encodeURIComponent(decoded);
}

function printSelected() {

  const ids = selectedIds();

  if (!ids.length) {
    alert('Selecciona al menos un registro.');
    return;
  }

  location.href =
    'imprimir.html?ids=' +
    ids.map(id => encodeURIComponent(id)).join(',');
}

function printAll() {

  if (!records.length) {
    alert('No hay registros para imprimir.');
    return;
  }

  location.href = 'imprimir.html';
}

function selectAll() {

  document
    .querySelectorAll('.record-check')
    .forEach(check => {
      check.checked = true;
    });

  masterCheck.checked = true;
}

function clearSelection() {

  document
    .querySelectorAll('.record-check')
    .forEach(check => {
      check.checked = false;
    });

  masterCheck.checked = false;
}

async function deleteOne(id) {

  const decoded =
    decodeURIComponent(id);

  const record =
    records.find(
      item => item.idRegistro === decoded
    );

  const name =
    record
      ? `${record.nombres} ${record.apellidos}`
      : decoded;

  if (
    !confirm(
      `¿Eliminar el registro de ${name}?\n\nEsta acción no se puede deshacer.`
    )
  ) {
    return;
  }

  const { error } =
    await window.supabaseClient
      .from('registros_vigilia')
      .delete()
      .eq('idRegistro', decoded);

  if (error) {

    console.error(error);

    alert(
      'Error al eliminar: ' +
      error.message
    );

    return;
  }

  await loadRecords();
}

async function deleteSelected() {

  const ids = selectedIds();

  if (!ids.length) {
    alert('Selecciona al menos un registro.');
    return;
  }

  if (
    !confirm(
      `¿Eliminar ${ids.length} registro(s)?\n\nEsta acción no se puede deshacer.`
    )
  ) {
    return;
  }

  const { error } =
    await window.supabaseClient
      .from('registros_vigilia')
      .delete()
      .in('idRegistro', ids);

  if (error) {

    console.error(error);

    alert(
      'Error al eliminar: ' +
      error.message
    );

    return;
  }

  await loadRecords();
}

async function deleteAll() {

  if (!records.length) {
    alert('No hay registros para eliminar.');
    return;
  }

  const confirmation =
    prompt(
      `ESTÁS A PUNTO DE ELIMINAR TODOS LOS REGISTROS (${records.length}).\n\nEscribe BORRAR para confirmar.`
    );

  if (confirmation !== 'BORRAR') {
    return;
  }

  const { error } =
    await window.supabaseClient
      .from('registros_vigilia')
      .delete()
      .neq('idRegistro', '');

  if (error) {

    console.error(error);

    alert(
      'Error al eliminar: ' +
      error.message
    );

    return;
  }

  await loadRecords();
}

search.addEventListener(
  'input',
  render
);

masterCheck.addEventListener(
  'change',
  () => {

    document
      .querySelectorAll('.record-check')
      .forEach(check => {
        check.checked =
          masterCheck.checked;
      });

  }
);

document.getElementById(
  'selectAll'
).onclick = selectAll;

document.getElementById(
  'clearSelection'
).onclick = clearSelection;

document.getElementById(
  'printSelected'
).onclick = printSelected;

document.getElementById(
  'printAll'
).onclick = printAll;

document.getElementById(
  'refresh'
).onclick = loadRecords;

document.getElementById(
  'deleteSelected'
).onclick = deleteSelected;

document.getElementById(
  'deleteAll'
).onclick = deleteAll;

loadRecords();
</script>

</body>
</html>
