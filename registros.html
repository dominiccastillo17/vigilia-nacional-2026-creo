<!doctype html>

<html lang="es">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>
Registros - Vigilia Nacional Procesos 2026
</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px;
}

header h1 {
  margin: 0;
  font-size: 20px;
}

header p {
  margin: 5px 0 0;
  font-size: 12px;
}

.toolbar {
  background: white;
  padding: 12px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

button {
  border: 0;
  border-radius: 7px;
  padding: 9px 13px;
  cursor: pointer;
  font-weight: bold;
  background: #2563eb;
  color: white;
}

button.secondary {
  background: #4b5563;
}

button.danger {
  background: #dc2626;
}

input[type="search"] {
  flex: 1;
  min-width: 220px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  padding: 9px;
}

main {
  padding: 15px;
}

.table-wrap {
  background: white;
  border-radius: 10px;
  overflow-x: auto;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 950px;
}

th,
td {
  padding: 9px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
  font-size: 12px;
}

th {
  background: #e5e7eb;
}

tr:hover {
  background: #f9fafb;
}

.empty {
  padding: 30px;
  text-align: center;
  color: #6b7280;
}

.actions {
  display: flex;
  gap: 5px;
}

.small {
  padding: 5px 8px;
  font-size: 11px;
}

.status {
  padding: 10px 15px;
  font-size: 12px;
}

</style>

</head>

<body>

<header>

<h1>
📋 Registros — Vigilia Nacional Procesos 2026
</h1>

<p>
Registros compartidos almacenados en Supabase
</p>

</header>


<div class="toolbar">

<input
  id="search"
  type="search"
  placeholder="Buscar por nombre, iglesia, teléfono..."
>

<button id="btnRefresh">
  🔄 Actualizar
</button>

<button id="btnSelectAll" class="secondary">
  ☑️ Seleccionar todos
</button>

<button id="btnClearSelection" class="secondary">
  Deseleccionar
</button>

<button id="btnPrintSelected">
  🖨️ Imprimir seleccionados
</button>

<button id="btnPrintAll">
  🖨️ Imprimir todos
</button>

<button
  id="btnBack"
  class="secondary"
>
  ← Volver
</button>

</div>


<div
  id="status"
  class="status"
>
  Cargando registros...
</div>


<main>

<div class="table-wrap">

<table>

<thead>

<tr>

<th></th>

<th>ID</th>

<th>Fecha</th>

<th>Nombres</th>

<th>Apellidos</th>

<th>Teléfono</th>

<th>Talla</th>

<th>Región</th>

<th>Distrito</th>

<th>Iglesia</th>

<th>Pago</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

<div
  id="empty"
  class="empty"
  style="display:none"
>
  No hay registros.
</div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script>

const supabase =
  window.supabaseClient;

let records = [];


const tbody =
  document.getElementById("tbody");

const empty =
  document.getElementById("empty");

const status =
  document.getElementById("status");

const search =
  document.getElementById("search");


function esc(value) {

  if (
    value === null ||
    value === undefined
  ) return "";

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function render() {

  const query =
    search.value
      .toLowerCase()
      .trim();


  const filtered =
    records.filter(r => {

      const text =
        [
          r.idRegistro,
          r.nombres,
          r.apellidos,
          r.telefono,
          r.iglesia,
          r.region,
          r.distrito
        ]
        .join(" ")
        .toLowerCase();

      return text.includes(query);

    });


  tbody.innerHTML = "";

  empty.style.display =
    filtered.length
      ? "none"
      : "block";


  filtered.forEach(r => {

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        <input
          type="checkbox"
          class="record-check"
          value="${esc(r.idRegistro)}"
        >
      </td>

      <td>
        ${esc(r.idRegistro)}
      </td>

      <td>
        ${esc(r.fechaRegistro)}
      </td>

      <td>
        ${esc(r.nombres)}
      </td>

      <td>
        ${esc(r.apellidos)}
      </td>

      <td>
        ${esc(r.telefono)}
      </td>

      <td>
        ${esc(r.talla)}
      </td>

      <td>
        ${esc(r.region)}
      </td>

      <td>
        ${esc(r.distrito)}
      </td>

      <td>
        ${esc(r.iglesia)}
      </td>

      <td>
        C$ ${esc(r.monto)}
      </td>

      <td>

        <div class="actions">

          <button
            class="small"
            onclick="openRecord('${esc(r.idRegistro)}')"
          >
            Abrir
          </button>

          <button
            class="small"
            onclick="printOne('${esc(r.idRegistro)}')"
          >
            🖨️
          </button>

        </div>

      </td>

    `;

    tbody.appendChild(tr);

  });

}


async function loadRecords() {

  status.textContent =
    "Cargando...";

  const {
    data,
    error
  } =
    await supabase
      .from("registros_vigilia")
      .select("*");


  if (error) {

    console.error(error);

    status.textContent =
      "❌ " + error.message;

    return;

  }


  records =
    data || [];


  records.sort(
    (a,b) =>
      String(b.idRegistro)
        .localeCompare(
          String(a.idRegistro)
        )
  );


  status.textContent =
    `${records.length} registro(s) encontrado(s).`;

  render();

}


function getSelected() {

  return [
    ...document.querySelectorAll(
      ".record-check:checked"
    )
  ].map(
    checkbox =>
      checkbox.value
  );

}


window.openRecord =
  function(id) {

    window.location.href =
      "imprimir.html?ids=" +
      encodeURIComponent(id);

  };


window.printOne =
  function(id) {

    window.open(
      "imprimir.html?ids=" +
      encodeURIComponent(id),
      "_blank"
    );

  };


document
  .getElementById("btnRefresh")
  .addEventListener(
    "click",
    loadRecords
  );


document
  .getElementById("btnBack")
  .addEventListener(
    "click",
    () => {
      window.location.href =
        "index.html";
    }
  );


document
  .getElementById("btnSelectAll")
  .addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          ".record-check"
        )
        .forEach(
          checkbox =>
            checkbox.checked = true
        );

    }
  );


document
  .getElementById("btnClearSelection")
  .addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          ".record-check"
        )
        .forEach(
          checkbox =>
            checkbox.checked = false
        );

    }
  );


document
  .getElementById("btnPrintSelected")
  .addEventListener(
    "click",
    () => {

      const ids =
        getSelected();

      if (!ids.length) {

        alert(
          "Selecciona al menos un registro."
        );

        return;

      }

      window.open(
        "imprimir.html?ids=" +
        ids
          .map(encodeURIComponent)
          .join(","),
        "_blank"
      );

    }
  );


document
  .getElementById("btnPrintAll")
  .addEventListener(
    "click",
    () => {

      if (!records.length) {

        alert(
          "No hay registros."
        );

        return;

      }

      window.open(
        "imprimir.html?ids=" +
        records
          .map(r =>
            encodeURIComponent(
              r.idRegistro
            )
          )
          .join(","),
        "_blank"
      );

    }
  );


search.addEventListener(
  "input",
  render
);


loadRecords();

</script>

</body>

</html>
